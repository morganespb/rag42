[project]
name = "rag"
version = "0.1.0"
description = "RAG system answering questions about the vLLM codebase"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.15.0",
    "fire>=0.7.1",
    "pydantic>=2.14.1",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.20.2",
]

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.0",
    "types-tqdm>=4.70.0.20260906",
]

[tool.mypy]
exclude = ["^\\.venv/", "^data/"]
